<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro - RAA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/estilos.css">

</head>

<body class="fondo">

<!-- NAVBAR -->

<nav class="navbar navbar-light bg-white shadow-sm">

<div class="container">

<a class="navbar-brand" href="index.html">
<img src="img/logo.png" height="45">
</a>

<div>
<a href="login.html" class="me-3">Iniciar sesión</a>
</div>

</div>

</nav>

<!-- FORMULARIO -->

<div class="container">

<div class="registro-container">

<h2>Crear cuenta</h2>

<p class="text-center text-muted">
Únete y ayuda a cambiar la vida de un animal 🐾
</p>

<form id="formRegistro">

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-user"></i></span>
<input type="text" class="form-control" placeholder="Nombre completo" required>
</div>

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-id-card"></i></span>
<input type="text" class="form-control" placeholder="Identificación" required>
</div>

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-calendar"></i></span>
<input type="date" class="form-control" required>
</div>

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-envelope"></i></span>
<input type="email" class="form-control" placeholder="Correo electrónico" required>
</div>

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-lock"></i></span>
<input type="password" class="form-control" id="password" placeholder="Contraseña" required>
</div>

<div class="input-group mb-3">
<span class="input-group-text"><i class="fa fa-lock"></i></span>
<input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar contraseña" required>
</div>

<button class="btn btn-registro">Registrarse</button>

<p class="mt-3 text-center">
¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
</p>

</form>

</div>

</div>

<script src="js/script.js"></script>

</body>
</html>
